name: Load hahishook

# Reload only החישוק's daily price file (the nightly ingest also does it).
on:
  push:
    branches: [main]
    paths: [".github/hahishook-trigger"]
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ONLY: hahishook
        run: python ingest/ingest.py
