name: Price-drop alerts

# The nightly ingest runs this too; this runs it alone (pushing the trigger file starts it).
on:
  push:
    branches: [main]
    paths: [".github/alerts-trigger"]
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest/alerts.py
