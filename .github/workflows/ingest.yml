name: Ingest prices

on:
  # Pushing a change to this file starts a run (lets automation trigger it without API access).
  push:
    branches: [main]
    paths: [".github/ingest-trigger"]
  schedule:
    # 06:17 UTC = 09:17 Israel in summer, 08:17 in winter: after every chain has
    # published its full daily files (the last, Osher Ad, at 08:00)
    - cron: "17 6 * * 0-4,6"
    # Fridays, for early shopping: 04:17 UTC = 07:17 summer / 06:17 winter - every
    # chain except Osher Ad (published at 08:00, so yesterday's file is used)
    - cron: "17 4 * * 5"
  workflow_dispatch:
    inputs:
      chains:
        description: "Optional comma-separated scraper names (e.g. SHUFERSAL,RAMI_LEVY)"
        required: false
      skip_stores:
        description: "Store lists: 1 = skip, 0 = refresh now, empty = only if older than a week"
        required: false
        default: ""

# A new run replaces one still in progress (it would load the same data).
concurrency:
  group: ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - name: Run ingestion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CHAINS: ${{ inputs.chains }}
          SKIP_STORES: ${{ inputs.skip_stores }}
        run: python ingest/ingest.py
      - name: Health check
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest/healthcheck.py
